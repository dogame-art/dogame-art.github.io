<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="{{ tagline }}">
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ tagline }}" />
    <meta property="og:image" content="{{ avatar }}" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:image" content="{{ avatar }}" />
    <meta property="twitter:title" content="{{ title }}" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./images/favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="./images/favicons/favicon-32x32.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="./styles.css" />
    
    <!-- Google Analytics -->
    {% if google_analytics_id %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ google_analytics_id }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '{{ google_analytics_id }}');
    </script>
    {% endif %}
</head>
<body>
    <div class="container">
        <!-- Profile Section - Left Aligned with Avatar -->
        <div class="profile-section">
            <img src="{{ avatar }}" alt="{{ name }}" class="avatar" />
            <div class="profile-info">
                <h1 class="name">{{ name }}</h1>
                <p class="tagline">{{ tagline }}</p>
            </div>
        </div>
        
        <!-- Links Section - Evenly Spaced Pills -->
        <div class="links-section">
            {% for link in links %}
            <a href="{{ link.link.url }}" 
               class="link-button" 
               target="{{ link.link.target }}"
               title="{{ link.link.title }}"
               alt="{{ link.link.alt }}">
                <i data-lucide="{{ link.link.icon }}"></i>
                <span>{{ link.link.text }}</span>
            </a>
            {% endfor %}
        </div>
        
        <!-- Socials Section - Centered Circles -->
        <div class="socials-section">
            <div class="social-links">
                {% for social in socials %}
                <a href="{{ social.social.url }}" 
                   class="social-link" 
                   target="{{ social.social.target }}"
                   title="{{ social.social.title }}"
                   alt="{{ social.social.alt }}">
                    <i data-lucide="{{ social.social.icon }}"></i>
                </a>
                {% endfor %}
            </div>
        </div>
        
        <!-- Footer Section -->
        <div class="footer-section">
            <p class="footer-text">{{ footer }}</p>
            <p class="copyright">{{ copyright }}</p>
        </div>
    </div>
    
    <!-- Lucide Icons - Secure CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" 
            crossorigin="anonymous" 
            referrerpolicy="no-referrer"></script>
    <script>
        // Initialize Lucide icons after DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
        });
    </script>
    
    <!-- Custom Click Tracking -->
    {% if google_analytics_id %}
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Track main link button clicks
        document.querySelectorAll('.link-button').forEach(button => {
            button.addEventListener('click', function() {
                const linkText = this.querySelector('span').textContent;
                gtag('event', 'click', {
                    'event_category': 'social_links',
                    'event_label': linkText,
                    'value': 1
                });
            });
        });
        
        // Track social icon clicks
        document.querySelectorAll('.social-link').forEach(link => {
            link.addEventListener('click', function() {
                const linkTitle = this.getAttribute('title');
                gtag('event', 'click', {
                    'event_category': 'social_icons',
                    'event_label': linkTitle,
                    'value': 1
                });
            });
        });
    });
    </script>
    {% endif %}
</body>
</html>
