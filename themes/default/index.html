<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - {{ tagline }}</title>
    <meta name="description" content="{{ tagline }}">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ name }}">
    <meta property="og:description" content="{{ tagline }}">
    <meta property="og:image" content="{{ avatar }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ avatar }}">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    {% if google_analytics_id %}
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ google_analytics_id }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ google_analytics_id }}');
    </script>
    {% endif %}
</head>
<body>
    <div class="container">
        <!-- Profile Section -->
        <div class="profile-section">
            <img src="{{ avatar }}" alt="{{ name }}" class="avatar">
            <div class="profile-info">
                <h1 class="name">{{ name }}</h1>
                <p class="tagline">{{ tagline }}</p>
            </div>
        </div>

        <!-- Links Section -->
        <div class="links-section">
            {% for link in links %}
            <a href="{{ link.link.url }}" class="link-button" target="{{ link.link.target }}" rel="noopener noreferrer">
                {% if link.link.icon %}
                <i data-lucide="{{ link.link.icon }}"></i>
                {% endif %}
                <span>{{ link.link.text }}</span>
            </a>
            {% endfor %}
        </div>

        <!-- Social Media Section -->
        <div class="socials-section">
            <div class="social-links">
                {% for social in socials %}
                <a href="{{ social.social.url }}" class="social-link" target="{{ social.social.target }}" rel="noopener noreferrer" aria-label="{{ social.social.title }}">
                    <i data-lucide="{{ social.social.icon }}"></i>
                </a>
                {% endfor %}
            </div>
        </div>

        <!-- Footer Section -->
        <div class="footer-section">
            <p class="footer-text">{{ footer }}</p>
            <p class="copyright">{{ copyright }}</p>
        </div>
    </div>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>

    <!-- Weekday Detector for Driphaus Badge -->
    <script>
    (function() {
      'use strict';
      
      function isWeekday() {
        const today = new Date();
        const dayOfWeek = today.getDay();
        return dayOfWeek >= 1 && dayOfWeek <= 5;
      }
      
      function updateWeekdayClass() {
        const body = document.body;
        
        if (isWeekday()) {
          body.classList.add('weekday');
          console.log('✓ Weekday detected - SNAPSHOT ACTIVE badge enabled');
        } else {
          body.classList.remove('weekday');
          console.log('✓ Weekend detected - SNAPSHOT ACTIVE badge disabled');
        }
      }
      
      updateWeekdayClass();
      
      setInterval(function() {
        const now = new Date();
        if (now.getHours() === 0 && now.getMinutes() === 0) {
          updateWeekdayClass();
        }
      }, 60000);
      
    })();
    </script>
</body>
</html>
