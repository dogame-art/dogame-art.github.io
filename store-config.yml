# ============================================
# DOGAME NFT STORE CONFIGURATION
# ============================================
# This file configures which artworks are available for minting

# Store Settings
store_enabled: true
treasury_wallet: "PLACEHOLDER_TREASURY_WALLET_HERE" # Set this to your actual treasury wallet
royalty_percentage: 5 # Percentage of secondary sales

# Network
network: "devnet" # devnet or mainnet-beta

# Artworks Available for Minting
# Each artwork needs to be uploaded to IPFS before enabling

# TEMPLATES - These are examples already minted elsewhere
# Set available: false to hide from store
artworks:
  # TEMPLATE: 1/1 Artwork Example
  - slug: "FlowerPower"
    title: "Flower Power (TEMPLATE)"
    description: "TEMPLATE - Already minted on Drip Haus"
    image: "art/FlowerPower.jpg"
    type: "1of1"
    price_sol: 0.1
    max_supply: 1
    minted_count: 0
    available: false # Disabled - this is just a template
    ipfs_metadata_uri: ""
    ipfs_image_uri: ""
    collection_address: null

  # TEMPLATE: Edition Example
  - slug: "WindowShopping"
    title: "Window Shopping (TEMPLATE)"
    description: "TEMPLATE - Already minted on Drip Haus"
    image: "art/image9.jpeg"
    type: "edition"
    price_sol: 0.05
    max_supply: 100
    minted_count: 0
    available: false # Disabled - this is just a template
    ipfs_metadata_uri: ""
    ipfs_image_uri: ""
    collection_address: null

  # Add your new artworks below this line:
  #
  # - slug: "YourArtworkName"
  #   title: "Your Artwork Title"
  #   description: "Your artwork description"
  #   image: "art/YourImage.jpg"
  #   type: "1of1"  # or "edition"
  #   price_sol: 0.1
  #   max_supply: 1  # 1 for 1/1s, higher for editions
  #   minted_count: 0
  #   available: false  # Set to true after uploading to IPFS
  #   ipfs_metadata_uri: ""
  #   ipfs_image_uri: ""
  #   collection_address: null

# ============================================
# INSTRUCTIONS FOR ADDING NEW ARTWORKS
# ============================================
#
# To add a new artwork for sale:
#
# 1. Add the artwork entry above with all details
# 2. Upload the artwork to IPFS:
#    npm run upload:ipfs -- --artwork SLUG_NAME
# 3. The script will update ipfs_metadata_uri and ipfs_image_uri
# 4. Set available: true
# 5. Deploy to production
#
# Artwork Types:
#   - 1of1: Single edition (max_supply: 1)
#   - edition: Multiple editions (set max_supply or null for open)
#
# Price Guidelines:
#   - 1/1s: 0.1 - 1 SOL
#   - Limited editions: 0.05 - 0.2 SOL
#   - Open editions: 0.01 - 0.05 SOL
