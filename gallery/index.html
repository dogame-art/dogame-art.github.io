<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Gallery — Dogame</title>
  <meta name="description" content="Dogame's art gallery — illustrations, digital art, and on-chain collectibles.">
  <meta property="og:title" content="Dogame Gallery">
  <meta property="og:description" content="Illustrations, digital art, and on-chain collectibles.">
  <meta property="og:url" content="https://dogame.art/gallery/">
  <link rel="stylesheet" href="/css/styles.css">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-95K6LY8JD8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-95K6LY8JD8');
  </script>
</head>
<body>
  <div class="page-wrapper page-wrapper--wide">
    <a href="/" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      Back to Home
    </a>

    <div class="gallery-header">
      <h1>Gallery</h1>
      <p>Illustrations, digital art, and on-chain collectibles.</p>
    </div>

    <!-- Chain Filters -->
    <div class="filters" id="filters">
      <button class="filter-btn active" data-chain="all">All</button>
      <button class="filter-btn" data-chain="solana">SOL</button>
      <button class="filter-btn" data-chain="tezos">TEZ</button>
      <button class="filter-btn" data-chain="ethereum">ETH</button>
      <button class="filter-btn" data-chain="bitcoin">BTC</button>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="gallery">
      <div class="gallery-loading">Loading artwork...</div>
    </div>

    <footer class="site-footer">
      &copy; 2026 Dogame. All rights reserved.
    </footer>
  </div>

  <!-- js-yaml for parsing artworks.yml -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"
          integrity="sha512-CSBhVREyzHAjAFfBlIBakjoRUKp5h7VSweP0InR/pAJyptH7peuhCsqAI/snV+TwZmXZqoUklpXp6R6wMnYf5Q=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer"></script>
  <script src="/js/gallery.js"></script>
</body>
</html>
