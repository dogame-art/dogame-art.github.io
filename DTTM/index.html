<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://app.cal.com https://cal.com; img-src 'self' https://www.google-analytics.com https://cal.com https://app.cal.com data:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://app.cal.com https://cal.com wss://app.cal.com; style-src 'self' 'unsafe-inline'; font-src 'self' https://app.cal.com; frame-src https://app.cal.com https://cal.com; object-src 'none'; base-uri 'self';">
  <title>Drawn to the Mic — Book an Interview</title>
  <meta name="description" content="Book an interview on Drawn to the Mic — the weekly artist interview show hosted by Dogame.">
  <meta property="og:title" content="Drawn to the Mic — Book an Interview">
  <meta property="og:description" content="Pick a time, reserve your slot, come share your story.">
  <meta property="og:url" content="https://dogame.art/DTTM/">
  <link rel="stylesheet" href="/css/styles.css">

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }
    .dttm-wrap {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 16px;
      gap: 10px;
      box-sizing: border-box;
    }
    .dttm-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex: 0 0 auto;
    }
    .dttm-top .back-link {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .dttm-top h1 {
      font-size: clamp(18px, 3vw, 24px);
      margin: 0;
      letter-spacing: -0.01em;
    }
    .dttm-top .tagline {
      color: var(--text-muted);
      font-size: 13px;
      display: none;
    }
    #cal-inline {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
    }
    #cal-inline iframe {
      display: block;
      width: 100% !important;
      height: 100% !important;
      border: 0;
    }
    .dttm-bottom {
      flex: 0 0 auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .dttm-bottom a {
      color: var(--text-muted);
    }
    @media (min-width: 700px) {
      .dttm-top .tagline { display: inline; }
      .dttm-wrap { padding: 16px 24px; gap: 14px; }
    }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-95K6LY8JD8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-95K6LY8JD8');
  </script>
</head>
<body>
  <div class="dttm-wrap">
    <header class="dttm-top">
      <a href="/" class="back-link" aria-label="Back to home">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Home
      </a>
      <h1>Drawn to the Mic — Book</h1>
      <span class="tagline">Pick a slot. No sign-in.</span>
    </header>

    <div id="cal-inline"></div>

    <footer class="dttm-bottom">
      Questions? DM <a href="https://twitter.com/Dogame_" target="_blank" rel="noopener noreferrer">@Dogame_</a>
    </footer>
  </div>

  <script type="text/javascript">
    (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");

    const isMobile = window.matchMedia('(max-width: 700px)').matches;
    const layout = isMobile ? "mobile" : "month_view";

    Cal("init", "dttm", { origin: "https://cal.com" });

    Cal.ns.dttm("inline", {
      elementOrSelector: "#cal-inline",
      config: { layout },
      calLink: "drawntothemic/book"
    });

    Cal.ns.dttm("ui", {
      theme: "dark",
      styles: { branding: { brandColor: "#7c5cfc" } },
      hideEventTypeDetails: false,
      hideBranding: true,
      layout
    });
  </script>
</body>
</html>
